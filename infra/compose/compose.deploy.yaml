# Deployed stack: the same services as compose.yaml, built on the demo server at one git sha.
# Used by infra/deploy/deployer.sh:
#
#   ACOM_TAG=<git sha> docker compose -f infra/compose/compose.yaml -f infra/compose/compose.deploy.yaml \
#     --env-file .env build && ... up -d --no-build
#
# Images are tagged acom/acom-<name>:<sha> (compose.yaml). The server's BuildKit cache keeps every
# layer, so an unchanged service rebuilds to the same image id and compose does not restart it.

services:
  postgres:
    environment:
      ACOM_OWNER_PASSWORD: ${ACOM_OWNER_PASSWORD:?set in the server .env}
      ACOM_APP_PASSWORD: ${ACOM_APP_PASSWORD:?set in the server .env}
    volumes:
      # after init.sql (scripts run in name order): replace the development role passwords
      - ../postgres/set-passwords.sh:/docker-entrypoint-initdb.d/zz-set-passwords.sh:ro
