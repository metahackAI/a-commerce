# Example of the Secrets the manifests reference. NOT part of any kustomization, and never apply
# it with real values from the repository. It documents names and keys:
#   - local: overlays/local generates these from git-ignored files in overlays/local/secrets/;
#   - production: create them from a secret store (External Secrets Operator, sealed-secrets, ...).
# Values below are placeholders.
---
# Database URLs. Services use DATABASE_URL (role acom_app, row-level security applies); the migrate
# Job uses MIGRATION_DATABASE_URL (role acom_owner). For a managed database add sslmode=require.
apiVersion: v1
kind: Secret
metadata:
  name: acom-database
  namespace: a-commerce
type: Opaque
stringData:
  DATABASE_URL: postgres://acom_app:CHANGE-ME@db.example.internal:5432/acom?sslmode=require
  MIGRATION_DATABASE_URL: postgres://acom_owner:CHANGE-ME@db.example.internal:5432/acom?sslmode=require
---
# Ed25519 key pair for gateway-signed internal tokens, mounted as files at /run/secrets/acom.
# The gateway mounts both; commerce, commerce-worker and agent mount only the public key.
#   openssl genpkey -algorithm ed25519 -out gateway_signing_key.pem
#   openssl pkey -in gateway_signing_key.pem -pubout -out gateway_public_key.pem
apiVersion: v1
kind: Secret
metadata:
  name: acom-gateway-keys
  namespace: a-commerce
type: Opaque
stringData:
  gateway_signing_key.pem: |
    -----BEGIN PRIVATE KEY-----
    (generated private key)
    -----END PRIVATE KEY-----
  gateway_public_key.pem: |
    -----BEGIN PUBLIC KEY-----
    (matching public key)
    -----END PUBLIC KEY-----
---
# Model endpoints, read by the agent only. Every key is optional.
# With components/models-vllm, GLIMMER_BASE_URL is http://models:8000/v1 and GLIMMER_MODEL is the
# id in ConfigMap models-config (VLLM_MODEL); HF_TOKEN is then read by the models pod for gated models.
apiVersion: v1
kind: Secret
metadata:
  name: acom-models
  namespace: a-commerce
type: Opaque
stringData:
  META_API_KEY: CHANGE-ME
  META_API_BASE_URL: https://model-api.example.com/v1
  SPARK_MODEL: planner-model-id
  GLIMMER_BASE_URL: http://models:8000/v1
  GLIMMER_MODEL: worker-model-id
---
# Local clusters only (infra/postgres component): superuser password of the in-cluster PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: acom-postgres
  namespace: a-commerce
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE-ME
