# Ingress is denied by default; each policy below opens one path. Egress stays open (the agent
# calls outside model endpoints; every pod needs DNS and the database).
# Calls allowed:
#   ingress controller / Gateway API proxy -> gateway:7000   (namespaces labeled acom.dev/ingress=true)
#   web -> gateway:7000 (server-side rendering)
#   gateway -> web:3000, commerce:7001, agent:7002
#   agent -> commerce:7001
#   monitoring namespace -> metrics port of gateway, commerce, commerce-worker, agent
# Components add their own (postgres, models).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/name: a-commerce
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    # The ingress controller or Gateway API proxy. Label its namespace:
    #   kubectl label namespace <controller-namespace> acom.dev/ingress=true
    - from:
        - namespaceSelector:
            matchLabels:
              acom.dev/ingress: "true"
      ports:
        - protocol: TCP
          port: 7000
    # The web server calls the gateway at ACOM_GATEWAY_INTERNAL_URL.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 7000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: commerce-ingress
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commerce
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent
      ports:
        - protocol: TCP
          port: 7001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ingress
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 7002
---
# Prometheus in the `monitoring` namespace scrapes /metrics on each Rust service's `http` port
# (7000, 7001, 7003, 7002). A named port matches each pod's own container port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-monitoring
  labels:
    app.kubernetes.io/name: a-commerce
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: a-commerce
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["gateway", "commerce", "commerce-worker", "agent"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: http
