# Commerce API (`acom-commerce serve`). /readyz succeeds only when the database answers and every
# migration is applied, so new pods stay out of the Service until the migrate Job has run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: a-commerce
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce
      app.kubernetes.io/part-of: a-commerce
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: a-commerce
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7001"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: commerce
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: commerce
          image: ghcr.io/metahackai/a-commerce/acom-commerce:latest
          args: ["serve"]
          ports:
            - name: http
              containerPort: 7001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: acom-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acom-database
                  key: DATABASE_URL
          volumeMounts:
            - name: gateway-public-key
              mountPath: /run/secrets/acom
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: gateway-public-key
          secret:
            secretName: acom-gateway-keys
            defaultMode: 288 # 0440
            items:
              - key: gateway_public_key.pem
                path: gateway_public_key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: a-commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/part-of: a-commerce
  ports:
    - name: http
      port: 7001
      targetPort: http
      protocol: TCP
