# Agent: chat turns over SSE. Calls commerce for tools and outside model endpoints (egress is open).
# Model settings come from Secret acom-models; every key is optional so the agent starts without them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: a-commerce
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
      app.kubernetes.io/part-of: a-commerce
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: a-commerce
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7002"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/metahackai/a-commerce/acom-agent:latest
          ports:
            - name: http
              containerPort: 7002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: acom-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acom-database
                  key: DATABASE_URL
            - name: META_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acom-models
                  key: META_API_KEY
                  optional: true
            - name: META_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: acom-models
                  key: META_API_BASE_URL
                  optional: true
            - name: SPARK_MODEL
              valueFrom:
                secretKeyRef:
                  name: acom-models
                  key: SPARK_MODEL
                  optional: true
            - name: GLIMMER_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: acom-models
                  key: GLIMMER_BASE_URL
                  optional: true
            - name: GLIMMER_MODEL
              valueFrom:
                secretKeyRef:
                  name: acom-models
                  key: GLIMMER_MODEL
                  optional: true
          volumeMounts:
            - name: gateway-public-key
              mountPath: /run/secrets/acom
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: gateway-public-key
          secret:
            secretName: acom-gateway-keys
            defaultMode: 288 # 0440
            items:
              - key: gateway_public_key.pem
                path: gateway_public_key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: a-commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: a-commerce
  ports:
    - name: http
      port: 7002
      targetPort: http
      protocol: TCP
