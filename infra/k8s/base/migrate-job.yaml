# Database migrations (`acom-commerce migrate`, as the owner role acom_owner).
# Under Argo CD this is a PreSync hook: it runs, and must succeed, before the Deployments roll.
# With plain `kubectl apply -k` it is created together with everything else; commerce, worker and
# agent stay unready (/readyz) until it has applied the migrations.
# A finished Job is removed after 10 minutes, so the next apply creates it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: a-commerce
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: a-commerce
    spec:
      restartPolicy: Never
      serviceAccountName: migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/metahackai/a-commerce/acom-commerce:latest
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: acom-config
                # On the first Argo CD sync this hook runs before acom-config exists;
                # migrate needs only the database URL, so it may start without the map.
                optional: true
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acom-database
                  key: MIGRATION_DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
