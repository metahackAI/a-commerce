# One ServiceAccount per component. None of the workloads talk to the Kubernetes API,
# so no token is mounted (the pods also set automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: a-commerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: a-commerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-worker
  labels:
    app.kubernetes.io/name: commerce-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: a-commerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: a-commerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: a-commerce
automountServiceAccountToken: false
---
# The migrate Job is an Argo CD PreSync hook, which runs before ordinary resources are applied.
# Making its ServiceAccount a PreSync hook too (one wave earlier) lets the very first sync work.
# Outside Argo CD these annotations do nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: a-commerce
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
