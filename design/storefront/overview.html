<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A-Commerce · storefront</title><link rel="stylesheet" href="../options/common.css">
<style>
body{padding:36px 40px;background:#fff}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 0 24px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px}
figure img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
figcaption{margin-top:9px;font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
figcaption b{font-weight:600}
figcaption code{font-family:var(--mono);font-size:11.5px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
figcaption span{flex-basis:100%;color:var(--mute);font-size:12.5px}
</style></head><body>
<h1>Storefront: the shopper talks, the page fits the person and the task</h1>
<div class="sub">Six shopper moments. Same tools, prices, and policies as the back office; a different component each time.</div>
<div class="g">
<figure><img src="fo-two-shoppers.png"><figcaption><b>Same question, two shoppers</b><code>compare_table</code><code>look_gallery</code><span>A returning spec-comparer gets a table; a first-time visitor gets photos. Each says why.</span></figcaption></figure>
<figure><img src="../mockups/store.png"><figcaption><b>Find and buy</b><code>compare_table</code><code>cart</code><span>Chips show what the store understood; the VIP sale price from the change set is in the cart.</span></figcaption></figure>
<figure><img src="fo-fit.png"><figcaption><b>Will it fit?</b><code>fit_check</code><span>Two sizes for two ways of wearing it, measured against something the shopper kept. Says what it did not use.</span></figcaption></figure>
<figure><img src="fo-gift.png"><figcaption><b>A gift for someone else</b><code>gift_picker</code><span>Nothing saved to the shopper's profile; address used once; gift receipt; the recipient can swap sizes.</span></figcaption></figure>
<figure><img src="fo-return.png"><figcaption><b>Something went wrong</b><code>return_options</code><span>Defect: new pair now, or refund that a person confirms (over $200). The same request shows up in the back office.</span></figcaption></figure>
<figure><img src="fo-mobile-adapt.png"><figcaption><b>Change the layout by asking</b><code>product_list → look_gallery</code><span>“Less text, bigger photos.” Same results, new layout, one memory line that can be undone.</span></figcaption></figure>
</div></body></html>
