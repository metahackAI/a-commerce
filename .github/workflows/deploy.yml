name: deploy

# Records a GitHub deployment for the `demo` environment. The demo server polls deployments
# (infra/deploy/deployer.sh), builds the images for that sha itself and restarts what changed:
# nothing here connects to the server, the server needs no inbound port, and no runner runs on it.
# Building on the server keeps its layer cache between deploys, which a hosted runner cannot.
# Details: infra/deploy/README.md.
#
# - Push to main: deploy the new head.
# - Run workflow (Actions tab): deploy main's head again, or an earlier sha to roll back.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (empty = head of the selected branch). Use an earlier main sha to roll back."
        required: false
        default: ""

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record a deployment for the demo server to pick up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.sha || github.sha }}
          BY: ${{ github.actor }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          jq -n --arg sha "$sha" --arg by "$BY" \
            '{ref: $sha, environment: "demo", auto_merge: false, required_contexts: [],
              description: ("requested by " + $by)}' \
            | gh api "repos/$REPO/deployments" --input - --jq '"deployment \(.id) for \(.sha)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
