name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled; installing them with apt hung for 15+ minutes.
    container: mcr.microsoft.com/playwright:v1.48.2-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd server && uv sync
      - run: cd web && npm ci
      - run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
