    - {tenant_id: store_northwind, id: rpl_5510, discussion_forum_posting_id: post_8805, reply_depth: 1, author_id: cus_riley, author_name: "Ri***", text: "Merino tee, the fleece half-zip and a shell works for me on the bike.", moderation_status: published, date_created: "2026-11-02T12:30:00-05:00"}
    - {tenant_id: store_northwind, id: rpl_5515, discussion_forum_posting_id: post_8809, reply_depth: 1, author_id: adm_sj, text: "Yes. M and L are due back on Thu Nov 12; ask for a restock alert and we will tell you the day they land.", moderation_status: published, date_created: "2026-11-05T11:10:00-05:00"}
