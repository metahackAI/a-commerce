# Community: the store's four boards (product reviews, style talk, questions to the store, store
# news), posts and replies by named shoppers of 02_customer.yml and by SJ for the store, and the
# reports on one post. Shoppers' names are stored masked as they were when written
# (community.yml moderation.author_masking: two letters shown, Jamie → Ja***); the store's
# posts and replies have no name and show as "The store". Everything is dated before the scene
# clock (Fri Nov 6 2026 11:00).
#
# Facts the rows keep consistent with the other files:
# - Jamie kept the windbreaker M Black (#20268, delivered Sep 11) and wrote about it on Sep 20.
# - The merino tee shrinks in a warm wash (the store's answer to qst_315); Jamie bought one in M
#   on Oct 24 (#20381) and wrote "Runs a bit small" on Thu Nov 5.
# - The chore coat M and L are due back Thu Nov 12 (03_catalog.yml); Grace waits for the M
#   (rsa_205) and asked here too.
# - The Fall check-in week runs Nov 9–15 (evt_0311 in 04_promotion.yml).
# - Noor's post links to another site; three shoppers reported it, two short of the
#   moderation.report_threshold of 5, so it is still published (list_posts reported: true).
# - Elena's question about a gift note is secret: only she and the store see it.
#
# The operator role also gets the community tools, so the store's operators (Mina, and the
# administrator) can moderate; SJ's roles (merchandiser, catalog admin) do not include them.
tables:
  platform.role_scope:
    - {tenant_id: store_northwind, role_id: rol_operator, scope: "tools:read:community"}
    - {tenant_id: store_northwind, role_id: rol_operator, scope: "tools:write:community"}
  community.board:
    - {tenant_id: store_northwind, id: brd_reviews, name: Product reviews, board_type: review, write_permission: member, allow_secret: false, allow_attachment: true, moderation_mode: post_review}
    - {tenant_id: store_northwind, id: brd_style, name: Style talk, board_type: free, write_permission: member, allow_secret: false, allow_attachment: true, moderation_mode: post_review}
    - {tenant_id: store_northwind, id: brd_questions, name: Ask the store, board_type: question, write_permission: member, allow_secret: true, allow_attachment: false, moderation_mode: post_review}
    - {tenant_id: store_northwind, id: brd_events, name: Store news and events, board_type: event, write_permission: staff, allow_secret: false, allow_attachment: true, moderation_mode: none}
  community.discussion_forum_posting:
    - tenant_id: store_northwind
      id: post_8790
      board_id: brd_reviews
      author_id: cus_jamie
      author_name: "Ja***"
      headline: Packs into its own pocket
