    - {tenant_id: store_northwind, id: rpl_5523, discussion_forum_posting_id: post_8812, parent_item_id: rpl_5521, reply_depth: 2, author_id: cus_jamie, author_name: "Ja***", text: "Good to know it's not just mine.", moderation_status: published, date_created: "2026-11-05T21:30:00-05:00"}
    - {tenant_id: store_northwind, id: rpl_5522, discussion_forum_posting_id: post_8812, reply_depth: 1, author_id: adm_sj, text: "A cool wash and a flat dry keep it true to size; the care label says the same.", moderation_status: published, date_created: "2026-11-06T09:05:00-05:00"}
