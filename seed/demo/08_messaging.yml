# Messaging: refund notices sent to cus_4431 for the three earlier returns, and the weekly email
# (template and campaigns). The B2 messages (two photo requests, one decline) are created by the scene,
# not seeded. Scene B3: the weekly email went out on the four Thursdays before Nov 5 and failed on
# Nov 5 at 08:00 (the list import failed); generate.yml `orders.campaign_orders` gives the orders that
# came from each sent email.
tables:
  messaging.message:
    - tenant_id: store_northwind
      id: msg_20298_refund
      recipient_id: cus_4431
      about_id: clm_20298
      message_kind: refund_done
      message_channel: email
      headline: Your refund for order 20298 is on its way
      text: "We've refunded $84.00 to your card ending 7302. It usually shows up within 3-5 business days."
      sender_id: sys_messaging
      change_set_id: null
      date_sent: "2026-10-12T11:05:00-04:00"
    - tenant_id: store_northwind
      id: msg_20324_refund
      recipient_id: cus_4431
      about_id: clm_20324
      message_kind: refund_done
      message_channel: email
      headline: Your refund for order 20324 is on its way
      text: "We've refunded $58.00 to your card ending 7302. It usually shows up within 3-5 business days."
      sender_id: sys_messaging
      change_set_id: null
      date_sent: "2026-10-21T10:15:00-04:00"
    - tenant_id: store_northwind
      id: msg_20311_refund
      recipient_id: cus_4431
      about_id: clm_20311
      message_kind: refund_done
      message_channel: email
      headline: Your refund for order 20311 is on its way
      text: "We've refunded $248.00 to your card ending 7302. It usually shows up within 3-5 business days."
      sender_id: sys_messaging
      change_set_id: null
      date_sent: "2026-10-26T15:35:00-04:00"
  messaging.message_template:
    - tenant_id: store_northwind
      id: tpl_weekly_email
      name: Weekly email
      message_channel: email
      message_purpose: marketing
      headline: "This week at Northwind: {{headline_item}}"
      text: "Hi {{customer_name}}, here is what is new this week. {{highlights}}"
      variables: [customer_name, headline_item, highlights]
      in_language: en-US
      template_status: in_use
  messaging.campaign:
    - {tenant_id: store_northwind, id: cmp_weekly_1008, name: Weekly email, message_channel: email, template_id: tpl_weekly_email, campaign_status: sent, scheduled_time: "2026-10-08T08:00:00-04:00", date_sent: "2026-10-08T08:02:00-04:00", recipient_count: 11204}
    - {tenant_id: store_northwind, id: cmp_weekly_1015, name: Weekly email, message_channel: email, template_id: tpl_weekly_email, campaign_status: sent, scheduled_time: "2026-10-15T08:00:00-04:00", date_sent: "2026-10-15T08:02:00-04:00", recipient_count: 11236}
    - {tenant_id: store_northwind, id: cmp_weekly_1022, name: Weekly email, message_channel: email, template_id: tpl_weekly_email, campaign_status: sent, scheduled_time: "2026-10-22T08:00:00-04:00", date_sent: "2026-10-22T08:01:00-04:00", recipient_count: 11251}
    - {tenant_id: store_northwind, id: cmp_weekly_1029, name: Weekly email, message_channel: email, template_id: tpl_weekly_email, campaign_status: sent, scheduled_time: "2026-10-29T08:00:00-04:00", date_sent: "2026-10-29T08:02:00-04:00", recipient_count: 11270}
    - tenant_id: store_northwind
      id: cmp_weekly_1105
      name: Weekly email
      message_channel: email
      template_id: tpl_weekly_email
      campaign_status: failed
      scheduled_time: "2026-11-05T08:00:00-05:00"
