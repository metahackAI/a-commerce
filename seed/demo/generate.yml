# Spec for the deterministic demo seed generator. This file is not data: it says what the
# generator adds on top of 01_platform.yml ... 08_messaging.yml so that the counts and totals in
# docs/scenarios.md §7 hold. Same seed + same named files => byte-identical rows.
# Times are store time (America/New_York); money is USD rounded to the cent, half up.

random_seed: 20261106            # one PRNG (PCG64 or ChaCha8), seeded once, consumed in the order of this file
store: store_northwind
runs_after: [01_platform.yml, 02_customer.yml, 03_catalog.yml, 04_promotion.yml, 05_merchandising.yml,
             06_sales.yml, 07_fulfillment.yml, 08_messaging.yml, 09_supplier_sheet.yml, 10_community.yml,
             11_partner.yml, 12_integration.yml]
never_touch:                     # named rows stay exactly as written; the generator adds no rows that point at them
  customers: [cus_jamie, cus_alex, cus_4431, cus_riley, cus_sam, cus_dana, cus_priya, cus_marcus, cus_elena,
              cus_noor, cus_theo, cus_grace, cus_owen]   # no generated orders, claims, coupons or preferences
  inventory: "offer.inventory_level is the stock at Fri Nov 6 11:00; generated orders do not change it"

id_patterns:                     # prefixes from docs/api/conventions.md §9; nnn/nnnnnn are zero-padded counters
  product_group: "prd_<category term_code>_<nn>"           # prd_summer_outerwear_01 ... prd_summer_outerwear_35
  product: "var_<category term_code>_<nn>_<size>_<color>"   # size and color lowercased, spaces -> _
  offer: "off_<same suffix as the variant>"
  sku: "<category initials>-<nn>-<color>-<size>"            # so-07-sand-m; unique in the store
  member: "cus_m<nnnnnn>"                                   # cus_m000001 ...
  address: "adr_m<nnnnnn>"                                  # one home address per generated member
  membership_number: "NW-1<nnnnn>"
  member_coupon: "mcp_m<nnnnnn>_<coupon suffix>_<yyyymm>"   # mcp_m000042_gold_10_202611
  unit_price_specification: "ups_<variant suffix>_autumn_knit"
  order: "ord_<order_number>"                               # order items oln_<number>_<line>, payment pay_<number>,
                                                            # delivery dlv_<number>, events keyed by (order_id, position)

catalog:
  total_products: 1009           # 18 named + 382 generated + 609 more_products, in 24 standard categories
  all_generated:
    approval_status: active
    brand_id: [brn_northwind, brn_northwind, brn_northwind, brn_ridgeline]   # pick uniformly from this list
    has_merchant_return_policy_id: mrp_standard
    cost: "list price × cost_ratio, rounded to the cent; cost × 1.15 must stay at or below the list price (no new below-cost products)"
    list_prices: "whole dollars ending in 9 (x9.00) inside the category range"
    variants: "colors × sizes from the category; stock split over variants at random, every variant ≥ 1 unless the product total is smaller"
    safety_stock: 2
  summer_outerwear:              # cat_summer_outerwear: 7 named + 35 generated = 42; sale scope in B1 is 40 (chore coat, rain parka excluded)
    count: 35
    list_price: {min: 59, max: 149}
    cost_ratio: 0.45             # cost = price × 0.45 exactly (then rounded)
    stock_per_product: {min: 12, max: 120}   # every generated one has ≥ 10 units, so promo_min_stock leaves all 35 in the sale
    sizes: [XS, S, M, L, XL]
    colors_per_product: {min: 1, max: 3}
    colors: [Sand, Olive, Navy, Stone, Clay, Sky, White, Black, Slate, Rust]
    names: "<material> <noun>"
    materials: [Linen, Cotton, Ripstop, Seersucker, Poplin, Chambray, Nylon, Twill]
    nouns: [overshirt, shacket, field jacket, anorak, bomber, shirt jacket, coach jacket, harrington, gilet, cagoule]
    additional_property:         # same shape as the named ones (compare_products attributes)
      weight_g: {min: 200, max: 700}          # weight of size M, also weight_value of every variant
      packing: [folds_flat, folds_flat, none, own_pocket]
      warmth: [light, light, medium, wind_layer]
      rain: [false, false, true]
