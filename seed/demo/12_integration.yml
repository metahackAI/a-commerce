# Integration: the demo store's outside channels and what they last sent. No outside system is
# connected in the demo (docs/scenarios.md): these rows are the store's own records of UPS, a
# marketplace and the card processor. Secrets are hashes only, as platform keeps its API keys;
# nobody holds the secrets behind these demo hashes (a signing secret's hash is the key events are
# checked with, so tests sign with the stored hash).
# - The marketplace's last copy: two orders and a return request that are not in the store yet
#   (order_id and claim_id empty), and one order it delivered.
# - The carrier and payment events behind Alex's #20402 (sales' order events name
#   receive_carrier_event): the card authorisation on Oct 27, the pickup on Oct 28 and the delivery
#   on Oct 31, all applied.
# - imp_1107, the store's own feed on Thu Nov 5: the merino tee's codes taken (prices unchanged),
#   one row rejected because "Trail tops" maps to no category. get_import_status reads it.
