    - {tenant_id: store_northwind, id: chn_carrier_ups, name: UPS, channel_type: carrier, url: "https://api.ups.example/v1", connection_status: connected, last_synced_at: "2026-11-06T10:55:00-05:00", credential_hash: "8f50fad544717fccc0b5fd9a1f60d8ef5290db9c00754199234d42d9955f2062", signing_secret_hash: "948544c8152def949ff64a2fb7a0157fbaf3ea4b1f946ba47093e329cc5c8731", status_mapping: {}}
