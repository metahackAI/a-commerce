# Merchandising: the 24 standard categories and 3 display categories, where the named products sit,
# the four main-page slots, and the hero bookings: the October edit (ended Fri 09:59) and Fall layers
# for everyone from Fri Nov 6 10:00 (change set #1039). The VIP booking for Nov 7-8 is made in scene B1.
# Curated pages: a draft winter edit, Travel light (showing until Nov 30) and the denim bundle page
# (scheduled with promo_denim_bundle, Nov 13-20). Popups: free shipping (November) and holiday hours
# (Dec 20-26). No row books the home hero, so it stays free for every tier.
