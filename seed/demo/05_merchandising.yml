      display_status: draft
      keywords: [winter coat]
    - tenant_id: store_northwind
      id: col_travel_light
      name: Travel light
      has_part: [{name: Jackets, item_list_element: [prd_windbreaker, prd_field_jacket, prd_rain_parka]}, {name: Layers, item_list_element: [prd_merino_tee, prd_fleece_half_zip, prd_camp_overshirt]}]
