# Platform: the fashion mall (tenant), its organization, the demo administrator (admin / admin123),
# the five system roles with the same scopes as the Northwind demo store, the demo clock, and the
# back-office menu. The catalog is generated (assortment.yml, brands.yml); see README.md.
# platform.online_store has no tenant_id column: its id is the tenant.
tables:
  platform.online_store:
    - {id: store_arbor_row, name: Arbor Row, url: arbor-row.example, currency: USD, time_zone: America/Los_Angeles, in_language: en}
  platform.organization:
    - {tenant_id: store_arbor_row, id: org_arbor_row, name: Arbor Row, organization_type: department}
  platform.admin_user:
    # Demo administrator. Sign in at /login with admin / admin123 (demo only; the hash is of "admin123").
    - {tenant_id: store_arbor_row, id: adm_admin, name: Administrator, alternate_name: Admin, email: "admin@arbor-row.example", job_title: Store administrator, admin_status: active, login_id: admin, password_hash: "$argon2id$v=19$m=19456,t=2,p=1$Zx0oEiPZFlNF6ugh5Hgyqw$2VJg1SY4v4wWKpM+UzhyUnP6mLBMKEM71Ioi7mPT0pI", organization_id: org_arbor_row}
  platform.role:
    - {tenant_id: store_arbor_row, id: rol_merchandiser, name: Merchandiser, description: "Runs promotions and the storefront, and handles returns and customer messages.", approver_roles: [merchandiser, operator], is_system: true}
    - {tenant_id: store_arbor_row, id: rol_operator, name: Operator, description: "Handles orders, returns, refunds and customer messages.", approver_roles: [operator], is_system: true}
    - {tenant_id: store_arbor_row, id: rol_catalog_admin, name: Catalog admin, description: Publishes products and approves structural catalog changes., approver_roles: [catalog_admin], is_system: true}
    - {tenant_id: store_arbor_row, id: rol_payout_approver, name: Payout approver, description: Approves cash remedies., approver_roles: [payout_approver], is_system: true}
    - {tenant_id: store_arbor_row, id: rol_platform_admin, name: Platform admin, description: "Manages roles, accounts, API keys and the demo clock.", approver_roles: [platform_admin], is_system: true}
  platform.role_scope:
    - {tenant_id: store_arbor_row, role_id: rol_merchandiser, scope: "tools:read:platform"}
