# Fashion mall assortment (draft): the store, its standard categories and the garment types each sells.
# Not data, and nothing reads it yet: the generator for this store is still to be written (README.md).
# Prices here are the mid tier's, in USD; brands.yml scales them by tier.
# A type's level picks its slice of the category range: 1 the lower third, 2 the middle, 3 the upper third.
# Types are unisex unless listed under women or men. Those two lists are written cheapest first, and a
# type's place in its list gives its level (first third 1, middle 2, last third 3).
# Every type keeps its noun in the product name.

store:
  id: store_arbor_row
  name: Arbor Row
  description: A fashion mall where about thirty brands sell, from luxury houses to SPA chains and boutique sellers.
  currency: USD
  in_language: en
  time_zone: America/Los_Angeles
  products: 5000

size_systems:
  alpha: [XS, S, M, L, XL]
  alpha_wide: [XS, S, M, L, XL, XXL]
  one_size: [One size]
  women_numeric: ["0", "2", "4", "6", "8", "10", "12", "14", "16"]
  waist: ["28", "30", "32", "34", "36", "38", "40"]
  suit: [36R, 38R, 40R, 42R, 44R, 46R, 40L, 42L, 44L]
  bra: [32B, 32C, 34B, 34C, 34D, 36B, 36C, 36D, 38C]
  shoe_us_men: ["7", "8", "9", "10", "11", "12", "13"]
  shoe_us_women: ["5", "6", "7", "8", "9", "10", "11"]
  sock: [S/M, L/XL]
  hat: [S/M, L/XL]
  glove: [S, M, L]
  belt: ["30", "32", "34", "36", "38", "40"]

