# Fashion mall assortment: the store, its departments and standard categories, the materials, and the
# garment types each category sells. The generator (acom_testkit::mall) reads it with brands.yml and
# policies/taxonomy/ (colors.yml for the colors, nodes.yml for the attributes each category needs).
# Prices here are the mid tier's, in USD; brands.yml scales them by tier.
# A type's level picks its slice of the category range: 1 the lower third, 2 the middle, 3 the upper third.
# Types are unisex unless listed under women or men. Those two lists are written cheapest first, and a
# type's place in its list gives its level (first third 1, middle 2, last third 3).
# Every type keeps its noun in the product name.
# Facts come from here by rule, never from the text model: material family, care and thickness from the
# material; fit from the words of the name; warmth, water resistance and heel height from the type.

store:                           # name, currency and time zone are on the store's row (01_platform.yml)
  id: store_arbor_row
  products: 5000
  random_seed: 20261113
  released: ["2025-09-01", "2026-11-01"]   # release dates are drawn between these
  safety_stock: 2
  return_policy: mrp_standard

countries: {IT: Italy, FR: France, GB: United Kingdom, PT: Portugal, ES: Spain, JP: Japan, US: United States, TR: Turkey, CN: China, IN: India, VN: Vietnam, LK: Sri Lanka, BD: Bangladesh, PE: Peru, MX: Mexico, KH: Cambodia, ID: Indonesia, KR: South Korea, NO: Norway}

departments:                     # the parent categories shoppers browse; brands.yml name words may name a department instead of its categories
  tops: {name: Tops, categories: [tees, polos, shirts, blouses, knitwear, sweatshirts]}
  coats_tailoring: {name: Coats and tailoring, categories: [outerwear, blazers, suits]}
  bottoms: {name: Bottoms, categories: [pants, denim, shorts, skirts]}
  dresses_jumpsuits: {name: Dresses and jumpsuits, categories: [dresses, jumpsuits]}
  active_intimates: {name: Active, lounge and intimates, categories: [activewear, loungewear, sleepwear, underwear, lingerie, swimwear]}
  shoes: {name: Shoes, categories: [sneakers, boots, dress_shoes, heels_flats, sandals]}
  bags_accessories: {name: Bags and accessories, categories: [bags, small_leather_goods, hats, belts, ties, scarves, gloves, socks]}

fit:                             # clothing only. The words of the type decide first, then the name word; otherwise drawn
  words:
    compression: [leggings, tights, sports bra, bike shorts, base layer]
    slim: [slim, skinny, cigarette, pencil, bodycon, sheath, tapered]
    relaxed: [relaxed, wide-leg, palazzo, mom, boyfriend, barrel, culottes, easy, cocoon]
    oversized: [oversized, boxy]
  drawn: {regular: 0.5, slim: 0.25, relaxed: 0.25}

# A type that has one of these words takes only materials whose name has it too, and the product name
# puts the material's full name in its place ("leather jacket" in Faux leather is a "faux leather jacket").
material_words: [leather, denim, selvedge, linen, canvas, suede, silk, lace, flannel, corduroy, seersucker, chambray, fleece, tweed, velvet, tulle, shearling, oxford, poplin, piqué, wool, down]

size_systems:
  alpha: [XS, S, M, L, XL]
  alpha_wide: [XS, S, M, L, XL, XXL]
  one_size: [One size]
  women_numeric: ["0", "2", "4", "6", "8", "10", "12", "14", "16"]
  waist: ["28", "30", "32", "34", "36", "38", "40"]
  suit: [36R, 38R, 40R, 42R, 44R, 46R, 40L, 42L, 44L]
  bra: [32B, 32C, 34B, 34C, 34D, 36B, 36C, 36D, 38C]
  shoe_us_men: ["7", "8", "9", "10", "11", "12", "13"]
  shoe_us_women: ["5", "6", "7", "8", "9", "10", "11"]
  sock: [S/M, L/XL]
  hat: [S/M, L/XL]
  glove: [S, M, L]
  belt: ["30", "32", "34", "36", "38", "40"]

foot_length_from:                # size system → the foot_length table in policies/taxonomy/apparel.yml
  shoe_us_men: us_men
  shoe_us_women: us_women

