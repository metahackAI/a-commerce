# Fashion mall brands (draft): tier rules and brand profiles. All brands, people and places are fictional.
# Not data, and nothing reads it yet. A brand's tier is its guardrail: every product the generator draws
# for a brand must pass the tier's rules, and a product that fails is not loaded.
# Facts and prices come from these rules; the text model only writes words from the facts.

tiers:                           # in price order, dearest first
  luxury:
    label: Luxury
    price_factor: [7.0, 12.0]    # × the mid-tier price drawn from the category range (assortment.yml)
    price_ending: tens           # $890
    materials: {premium: 0.75, standard: 0.25, value: 0}
    origin: [IT, FR, GB, PT, ES, JP]
    colors_per_product: [1, 3]
    stock_per_variant: [1, 6]
    women_sizes: women_numeric   # for dresses, blouses, skirts, pants, blazers, suits, jumpsuits
    name: "{detail} {material} {type}"
    details: [Double-faced, Hand-finished, Unlined, Belted, Shawl-collar, Cable-knit, Pleated, Bias-cut, Draped, Tailored]
    voice: Measured and exact. About cut, cloth and making; no hype and no superlatives.
  designer:
    label: Designer
    price_factor: [2.5, 4.5]
    price_ending: fives          # $345
    materials: {premium: 0.45, standard: 0.55, value: 0}
    origin: [PT, IT, JP, US, TR, ES, VN, CN]
    colors_per_product: [2, 4]
    stock_per_variant: [2, 10]
    women_sizes: women_numeric
    name: "{material} {detail} {type}"
    details: [Relaxed, Cropped, Longline, Boxy, Fluid, Structured, Wrap-front, Pleat-front, Raw-hem, Utility]
    voice: Clear and confident. What it is, what it is made of, how it wears.
  contemporary:
    label: Contemporary
    price_factor: [1.5, 2.4]
    price_ending: eights         # $168
    materials: {premium: 0.15, standard: 0.75, value: 0.10}
    value_only_in: [activewear, outerwear, swimwear]
    origin: [PT, TR, CN, IN, VN, LK, ES, IT]
    colors_per_product: [2, 4]
    stock_per_variant: [3, 15]
    name: "{detail} {material} {type}"
    details: [Relaxed, Easy, Puff-sleeve, Belted, Cropped, High-rise, Wide-leg, Slim, Soft, Pleated]
    voice: Warm and plain. How it fits and when to wear it.
  mid:
    label: Mid
    price_factor: [1.0, 1.0]     # the category range itself
    price_ending: nines          # $79 (as Northwind)
    materials: {premium: 0.05, standard: 0.70, value: 0.25}
    premium_allowed: [Merino wool, Lambswool, Suede, Pima cotton, Selvedge denim]
    origin: [CN, VN, IN, BD, US, PE, MX, KH, ID, TR]
    colors_per_product: [3, 5]
    stock_per_variant: [5, 25]
    name: "{material} {type}"
    voice: Practical. What it does and how to care for it.
  spa:
    label: SPA
    price_factor: [0.35, 0.6]
    price_ending: ninety_cents   # $24.90
    materials: {premium: 0, standard: 0.55, value: 0.45}
    origin: [BD, VN, CN, KH, TR, IN]
    colors_per_product: [4, 8]
    stock_per_variant: [20, 120]
    sizes_wide: true             # alpha_wide (to XXL) where the category uses alpha
    name: "{basic} {type}"
    basics: [Essential, Everyday, Easy-care, Smart, Soft, Relaxed, Light, Basic, Stretch, Airy]
    voice: Short and practical. Comfort, ease and how many ways to wear it.
  boutique:
    label: Boutique
    price_factor: [0.3, 0.55]
    price_ending: whole          # $29.00
    materials: {premium: 0, standard: 0.40, value: 0.60}
    origin: [KR, CN, VN, TR]
    colors_per_product: [3, 6]
    stock_per_variant: [3, 20]
    one_size_share: 0.5          # half of tees, blouses, knitwear, sweatshirts, dresses, skirts and loungewear sell as One size
    name: "{trend} {type}"
    trends: [Puff-sleeve, Ruched, Cropped, Balloon-sleeve, Shirred, Ribbed, Oversized, Wide-leg, Square-neck, Lace-trim, Pintuck, Ruffled, Two-way, Side-slit]
    voice: Friendly. One styling idea; still only the facts.

rules:                           # checked on every drawn product; a failure drops the product
  - The price lies inside the brand's tier band for that category (mid range × price_factor).
  - The material is one the tier allows, in the category it fits (assortment.yml materials.fits).
  - The country of origin is on the tier's list.
  - Every color is on the brand's palette and in policies/taxonomy/colors.yml.
  - The product's gender is drawn from the brand's audience among the genders the category's types allow
    (a men's tailor's ties are all men's). A category with no type for any of the brand's genders is an error.
  - Within one brand, a dearer type never costs less than a cheaper type of the same category on average.

