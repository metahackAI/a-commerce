# policy: catalog — 상품·변형·재고·가격 규칙 (데이터)
# 백엔드가 로드·강제한다. 프롬프트나 코드 상수에 숨기지 않는다.
# 값은 의미 있는 영단어, 금액은 {value, currency}. 데모 값은 plan.md §4.1과 같다.
version: 2

price_floor:                             # check: price_floor (set_sale_prices, set_price, import_products)
  formula: "cost * 1.15"                 # 원가 + 15% 아래로 팔지 않음
  applies_to: [list_price, sale_price]
  on_violation: block                    # 프리뷰에서 실패. 에러 below_price_floor, fix_tool: set_sale_prices
  example:                               # Seersucker overshirt: 원가 $56.00 → 하한 $64.40
    cost: { value: 56.00, currency: USD }
    floor: { value: 64.40, currency: USD }

pricing_rule:                            # P2, 상품 초안 작성 시
  formula: "cost * 2.5"
  round_to: nearest_ending_in_9          # 예: 원가 $35.60 → $89.00

pricing:
  levels: [cost, list_price, sale_price] # sale_price는 promotion이 만드는 기간 한정 회원 판매가
  cost_visibility: internal_only         # 원가는 쇼퍼에게 보이지 않음
  rounding: cent
  sale_price:
    auto_revert: true                    # 기간이 끝나면 정가로 돌아감
    compute: on_demand                   # 배치로 켜고 끄지 않고 valid_from·valid_through로 계산

product:
  required_on_create: [seller, category, name]
  approval:
    content_changes: auto                # 설명·이미지·문구 = 자동
    structural_changes: review           # 가격·카테고리·구조·삭제 = 승인 필요
  age_restriction:                       # 상품별 min_age(정수, 세). 0 또는 없음 = 연령 제한 없음
    field: min_age
    allowed_values: any                  # [default] 0 이상 정수 아무 값. 스토어가 목록으로 좁힐 수 있음
    # 예시: allowed_values: [0, 15, 19]  — 관할·업종에 맞춰 스토어가 정함
    by_category: {}                      # [default] 카테고리별 최소 min_age(스토어 정의). 예시: { spirits: <값> }
    verification:
      method: self_declared_birth_date   # [default] 다른 값: id_document, third_party_identity, manual_review
      verify_at: order                   # [default] order | cart | product_view
      reverify_after_days: null          # [default] 재확인하지 않음
    on_fail: block_purchase

variant:
  max_option_axes: null                  # [default] null = 제한 없음. 스토어가 정수로 상한을 둘 수 있음
  # 성능 참고: 조합 수 = 축별 값 수의 곱. 축이 늘면 변형 수가 급증하므로 max_variants_per_group으로 함께 제한한다.
  max_variants_per_group: 1000           # [default] 조합 폭증 방지(check: max_variants)
  option_source: inline                  # 입력할 때 만들고, 백엔드가 중복 제거

inventory:
  managed_at: variant                    # 재고는 변형(사이즈·색) 단위로만 관리
  product_status: derived                # 상품 상태는 변형에서 파생(읽기 전용)
  availability_values: [in_stock, out_of_stock, pre_order, discontinued]   # schema.org ItemAvailability
  auto_out_of_stock_when: "inventory_level == 0"
  auto_restore_when: "inventory_level > 0 and was_auto_out_of_stock"
  safety_stock:
    enabled: true
    alert_only: true                     # 판매 상태와 무관, 알림만

bundle:
  derive_price_from: components
  derive_stock_from: components
  constraints: [same_seller, same_age_restriction]

gift_card:                               # 디지털 상품권
  disallow: [pre_order, subscription, exchange]
  delivery: instant
  expiry: [absolute_date, days_from_purchase]
