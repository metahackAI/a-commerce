# policy: customer — 회원·등급·동의·개인정보·상담·보상 규칙 (데이터)
# 값은 의미 있는 영단어, 금액은 {value, currency}.
version: 3

# "# 기본값" 표시가 붙은 값은 스토어가 바꾸지 않았을 때 쓰는 값이다.

member:
  types: [individual, business]
  states: [active, dormant, withdrawn, blocked]
  dormant_after_days: 365                # 기본값
  login_methods: [password, linked_login]   # linked_login = 외부 계정 로그인 연결. 제공자는 integration 도메인에 등록

password:                                # 사람 전용 엔드포인트만 다룸. 에이전트·툴은 비밀번호를 받지도 보지도 않음
  min_length: 8                          # 기본값
  max_length: 64                         # 기본값
  require_classes: [letter, digit]       # 기본값. 고를 수 있는 값: letter, upper, lower, digit, symbol
  reject:                                # 기본값
    - contains_login_id                  # 로그인 id·이메일 앞부분을 포함
    - sequential_run_3                   # abc, 123처럼 3자 이상 연속
    - known_breached                     # 유출 비밀번호 목록 대조(제공자 플러그인, 없으면 건너뜀)
  history_block: 3                       # 기본값. 최근 3개와 같은 비밀번호 금지
  rotation_reminder_days: null           # 기본값 null = 주기적 변경 요구 없음. 숫자면 그 뒤 변경을 권유(강제 아님)
  lockout:                               # 로그인 실패 잠금
    failed_attempts: 5                   # 기본값
    window_minutes: 15                   # 기본값
    lock_minutes: 30                     # 기본값
    unlock_by: [wait, password_reset]
  on_change: revoke_other_sessions       # 기본값. revoke_all_sessions | revoke_other_sessions | keep
  on_reset: revoke_all_sessions          # 기본값
  storage: adaptive_hash                 # 고정. 평문·복호화 가능한 저장 금지

identity_verification:                   # 본인 확인 = 교체 가능한 방법(플러그인) 목록. id는 스토어가 정함
  methods:
    - id: email_code                     # 기본값(켜짐)
      type: one_time_code
      channel: email
    - id: email_link                     # 기본값(켜짐)
      type: magic_link
      channel: email
    - id: sms_code                       # 기본값(켜짐, 회원에게 전화번호가 있을 때)
      type: one_time_code
      channel: sms
    - id: business_registry              # 기본값(사업자 회원에만). 사업자 등록 정보 조회 제공자
      type: registry_lookup
      provider: null                     # integration 도메인에 등록한 제공자 id
    # - id: identity_provider            # 예시: 외부 신원 확인 제공자(지역별 신원 확인 서비스 등)
    #   type: external_provider
    #   provider: idp_example            # integration 도메인에 등록한 제공자 id
    #   returns: [verified_name, verified_birth_date, subject_fingerprint]
  required_for:                          # 목적별로 허용하는 방법. 목록 앞쪽이 기본 제안
    signup: [email_code, sms_code]                 # 기본값
    contact_change: [sms_code, email_code]         # 기본값. 새 연락처로 확인
    password_reset: [email_link, sms_code]         # 기본값
    login_id_recovery: [sms_code, email_code]      # 기본값
    withdrawal_reauth: [password, email_code]      # 기본값. password = 현재 비밀번호(사람 전용)
    business_verification: [business_registry]    # 기본값
  code: { length: 6, ttl_seconds: 300, max_attempts: 5 }   # 기본값
  link_ttl_seconds: 1800                 # 기본값
  token_ttl_seconds: 300                 # 기본값. verification_token은 1회용
  resend_cooldown_seconds: 60            # 기본값. check: verification_rate_limit
  max_sends_per_destination_per_hour: 5  # 기본값

account_recovery:                        # 비밀번호 재설정·로그인 id 찾기 (사람 전용)
  identifiers: [email, login_id, telephone]   # 기본값. 재설정 요청에 받는 식별자
  uniform_response: true                 # 고정. 계정 유무와 관계없이 같은 응답·비슷한 응답 시간(계정 열거 방지)
  rate_limits:                           # 초과 시에도 계정 유무와 무관하게 같은 rate_limited
    per_identifier: { count: 3, per_minutes: 60 }   # 기본값
    per_client: { count: 20, per_minutes: 60 }      # 기본값. IP·기기 기준
  confirm_max_attempts: 5                # 기본값. 코드 오입력이 넘으면 요청 무효
  token_single_use: true                 # 고정
  invalidate_previous_requests: true     # 기본값. 새 요청이 오면 이전 링크·코드 무효
  notify_on_reset: true                  # 기본값. 재설정 완료를 등록된 연락처로 알림(거래성 메시지)
  operator_initiated: send_link_only     # 고정. 운영자는 send_password_reset으로 링크 발송만. 임시 비밀번호 없음
  linked_login_only_accounts: explain_and_offer_setup   # 비밀번호 없는 계정이면 연결 로그인 안내 + 비밀번호 설정 링크
  business_members: designated_contact   # 사업자 회원은 지정 담당자 연락처로 확인
  login_id_recovery:
    delivery: send_to_verified_contact   # 기본값. 또는 show_masked_after_verification
    masking: partial                     # 화면에 보일 때 일부만

tier:                                    # MemberProgram(has_tiers) → MemberProgramTier. 등급 이름·개수는 코드가 아니라 데이터(define_tier_program)
  programs_max: 3                        # 기본값. 스토어당 프로그램 수
  tiers_max: 20                          # 기본값. 프로그램당 등급 수
  tier_id_scope: store                   # 고정. tier id는 스토어 안에서 유일(valid_for_member_tier가 id만으로 가리킴)
  rank: higher_is_better                 # 고정. rank는 프로그램 안에서 중복 금지
  entry_tier: required                   # 고정. 요건 없는 최하위 등급 1개. 신규 회원이 들어감
  guests: no_tier                        # 고정
  requirement:                           # has_tier_requirement 한 항목의 스키마와 기본값
    metrics: [spend, order_count, points_earned, manual, invite, custom]
    combine: any                         # 기본값. 한 등급의 요건 여러 개를 any | all로 묶음
    window: { type: rolling, length: 6, unit: month }   # 기본값. type: rolling | calendar | lifetime
    retain_threshold: same_as_threshold  # 기본값. 유지 기준을 진입 기준보다 낮게 둘 수 있음
    counts:                              # 실적에 무엇을 셀지
      order_status: delivered            # 기본값
      net_of_returns: true               # 기본값. 반품·취소 금액 차감
      include_loyalty_spent: true        # 기본값. 적립금으로 낸 금액도 구매액에 포함
      channels: [web, app]               # 기본값. 상담원 대리 주문 등은 제외. 스토어가 채널 추가 가능
  benefit_types:                         # has_tier_benefit 종류
    member_price: loyalty_price          # valid_for_member_tier 대상이 됨 (schema.org TierBenefitLoyaltyPrice)
    points_multiplier: loyalty_points    # membership_points_earned 배율 (TierBenefitLoyaltyPoints)
    free_shipping: loyalty_shipping      # TierBenefitLoyaltyShipping. min_subtotal 선택
    free_returns: loyalty_returns        # TierBenefitLoyaltyReturns
    coupon_on_entry: acom                # 등급 진입 시 쿠폰 발급(promotion issue_coupon)
    recurring_coupon: acom               # 평가 주기마다 발급
    custom: acom                         # 이름·설명만 가진 혜택(예: 우선 상담)
  evaluation:
    schedule: { every: month, on_day: 1, at: "03:00" }   # 기본값. 스토어 시간대
    on_event: [order_delivered]          # 기본값. 이벤트 시 승급만 즉시 확인. 비우면 정기 평가만
    settle_days: 14                      # 기본값. 반품 가능 기간이 지난 주문만 실적에 셈
    scheduled_runs: standing_approval    # 기본값. 승인된 프로그램 정의가 정기·이벤트 평가의 승인. each_run이면 매번 W$
    ad_hoc_runs: always_ask              # 고정. run_tier_evaluation은 W$
  movement:
    upgrade: immediate                   # 기본값. immediate | at_schedule
    downgrade: at_schedule               # 기본값. 정기 평가에서만
    max_steps_down: 1                    # 기본값. 한 번에 한 단계만 강등
    grace_periods: 1                     # 기본값. 요건 미달 첫 평가는 유지 + 강등 예고
    on_downgrade_issued_benefits: keep   # 기본값. 발급한 쿠폰은 회수 안 함(사용 시 등급 일치는 promotion.yml coupon.tier_match)
  override:                              # set_member_tier. check: tier_override_reason, tier_override_expiry
    reason_required: true                # 고정
    max_days: 365                        # 기본값. 만료 없는 수동 등급 금지
    after_expiry: re_evaluate            # 기본값. re_evaluate | revert_to_previous
    issue_entry_benefits: false          # 기본값
    evaluation_respects_override: true   # 고정. 만료 전에는 평가가 바꾸지 않음
  notify:                                # messaging 도메인으로 발송
    on: [upgrade, downgrade, downgrade_warning]   # 기본값
    message_kind: transactional          # 기본값. 판촉 문구를 넣으면 marketing으로 보고 consent.marketing_gate 적용
  program_change:                        # define_tier_program
    preview_impact: required             # 고정. check: tier_member_impact
    removing_tier_requires: migrate_members_to   # check: tier_migration
    block_if_referenced_by: [active_promotions, active_coupons, display_targeting]   # check: tier_referenced
    takes_effect: next_evaluation        # 기본값. 또는 immediately(평가를 바로 실행, 같은 승인)
    versioned: true                      # 고정. 정의는 버전으로 남고 되돌릴 수 있음
  history: append_only                   # 고정. list_tier_history

# 예시(데모 스토어 값) — 형태를 보여 줄 뿐 설계의 일부가 아니다. 실제 정의는 define_tier_program으로 저장한다.
# program: { program_id: prg_rewards, name: "Northwind Rewards" }
# has_tiers:
#   - { tier: member, name: Member, rank: 0 }                       # entry tier, 요건 없음
#   - tier: gold
#     name: Gold
#     rank: 1
#     has_tier_requirement: [{ metric: spend, threshold: { value: 300.00, currency: USD } }]
#     has_tier_benefit: [{ type: points_multiplier, value: 1.5 },
#                        { type: coupon_on_entry, coupon_id: cpn_gold_welcome, quantity: 1 }]
#   - tier: vip
#     name: VIP
#     rank: 2
#     requirement_combine: any
#     has_tier_requirement: [{ metric: spend, threshold: { value: 800.00, currency: USD },
#                              retain_threshold: { value: 600.00, currency: USD } },
#                            { metric: invite }]
#     has_tier_benefit: [{ type: member_price }, { type: free_shipping },
#                        { type: points_multiplier, value: 2.0 }]

consent:
  mandatory: [terms, privacy]
  optional: [marketing_email, marketing_sms, marketing_push]
  history: immutable
  marketing_gate: opt_in                 # check: consent_required. 동의한 경우에만 마케팅 발송

privacy:
  pii_encrypted_at_rest: [name, telephone, email, tax_id]
  masking_default: true                  # 기본 마스킹, 해제하면 사유 기록
  access_reason_logging: required
  payment_card_shown: last4_only

preference:                              # 쇼퍼 기억 (acom:Preference)
  source_required: true                  # 어디서 알게 됐는지(source: conversation) 기록
  shown_to_shopper: true
  undo: person_only                      # POST /memories/{id}/undo

withdrawal:                              # 탈퇴. check_withdrawal_eligibility(R) → 사람 전용 POST /me/withdrawal
  initiator: self_only                   # 고정. 운영자·에이전트는 탈퇴를 실행할 수 없음
  reauthentication: required             # 고정. 방법은 identity_verification.required_for.withdrawal_reauth
  reasons: [not_using, too_many_messages, privacy_concern, poor_service, found_alternative, other]   # 기본값
  multiple_reasons: true                 # 기본값
  confirmation_max_age_minutes: 30       # 기본값. 확인한 자격 결과가 이보다 오래되면 다시 확인
  blockers:                              # 각 항목: block | warn | ignore
    open_orders: block                   # 기본값. 결제 후 배송 완료 전
    claim_window_days: 14                # 기본값. 배송·반품 완료 후 이 기간 안의 주문은 open_orders로 취급
    open_claims: block                   # 기본값
    open_inquiries: block                # 기본값
    pending_refunds: block               # 기본값
    pending_remedies: block              # 기본값
  balances:                              # 잔액 처리: block | forfeit | pay_out
    loyalty_points: block                # 기본값. forfeit면 소멸 금액을 자격 결과에 보여 줌
    store_credit: pay_out                # 기본값. 돌려줄 수 있는 충전금은 지급 후 탈퇴
  on_withdraw:
    coupons: void                        # 기본값
    active_subscriptions: cancel_at_period_end   # 기본값. 또는 block
    linked_logins: unlink                # 기본값. 또는 block
    employee_benefits: end               # 기본값. 남은 할인 한도 소멸
    marketing_consent: revoke            # 고정
    sessions: revoke_all                 # 고정
    tier: remove                         # 고정. 재가입해도 이관 없음
    notify_member: true                  # 기본값. 완료 안내는 거래성 메시지(마케팅 동의와 무관)
    log_blocked_attempts: true           # 기본값. 막힌 시도와 사유를 액션 로그에
  cooling_off_days: 0                    # 기본값 0 = 즉시. 양수면 그동안 로그인으로 취소 가능, 끝나면 확정
  data_handling:
    delete_now: [addresses, preferences, wishlist, refund_accounts, device_tokens, linked_login_ids]   # 기본값
    mask_now: [name, telephone, email, birth_date]   # 기본값. 회원 레코드는 가린 채 withdrawn으로 남음
    authored_content: anonymize          # 기본값. 리뷰·글·댓글: anonymize | delete | keep
    retain:                              # 법령·분쟁 대응 보존. 기간은 스토어 관할 법령에 맞게 설정
      - { data: order_and_payment_records, days: 1825, why: tax_and_consumer_protection }   # 기본값
      - { data: claims_and_inquiries, days: 1095, why: dispute_handling }                   # 기본값
      - { data: consent_history, days: 1825, why: proof_of_consent }                        # 기본값
      - { data: rejoin_check_fingerprint, days: 90, why: prevent_signup_benefit_abuse }     # 기본값. 연락처·확인 결과의 단방향 해시만
    retained_storage: separated_encrypted   # 고정. 운영 데이터와 분리, 열람 시 사유 기록(privacy.access_reason_logging)
    purge: daily                         # 기본값. 보존 기간이 끝난 데이터를 파기
  rejoin:
    block_days: 90                       # 기본값. 지문이 같은 사람의 재가입 대기. 0이면 바로 가능
    signup_benefits: not_reissued        # 기본값. 가입 혜택 재지급 없음
    carry_over: none                     # 고정. 등급·적립금·쿠폰 이관 없음
  identifier_reuse:                      # 탈퇴한 로그인 id·이메일을 다시 쓸 수 있는가
    login_id: after_hold                 # 기본값. after_hold(rejoin.block_days 뒤) | never | immediately
    email: after_hold                    # 기본값

customer_service:
  inquiry_types: [order_status, return, product_question, account, other]
  states: [received, in_progress, resolved]
  assignment: [auto_round_robin, manual]
  auto_assign_interval_minutes: 10
  notify_member_on_resolve: true

remedy:
  liability: [store_fault, seller_fault, customer_claim]
  types: [loyalty_points, coupon, cash]
  approval_levels: [agent_request, remedy_approver, payout_approver]
  cash_requires: [verified_refund_account, payout_approval]
  loyalty_grant_over: { value: 50.00, currency: USD }   # approval.yml loyalty_grant
