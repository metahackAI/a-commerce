# policy: approval — 사람 승인이 필요한 경우 (데이터)
# 프리뷰의 needs_approval·approval_reason은 이 파일로 정한다. W$는 항상 승인.
# 금액은 {value, currency}. 데모 값은 plan.md §4.1과 같다.
version: 2

customer_messages: always_ask            # send_customer_message는 항상 승인

change_set:
  undo_window_after_end_days: 1          # 되돌리기 기한 = 프로모션 종료 + 1일 (#1042: Nov 9 23:59)
  approve_requires_latest_version: true  # 최신 버전이 아니면 승인 거부

thresholds:
  # key: { when, requires, approver_role }
  refund:
    when: "amount > refund_without_person_max"
    amount: { value: 200.00, currency: USD }   # $200.00 초과 환불은 사람 승인
    requires: human_approval
    approver_role: operator
    below_threshold: auto
  loyalty_grant:
    when: "amount > 50.00"
    amount: { value: 50.00, currency: USD }
    requires: human_approval
    approver_role: operator
  price_change_bulk:
    when: "changed_offers >= 10"
    requires: human_approval
    approver_role: merchandiser
  promotion_publish:
    when: always                         # 고객에게 닿음 (set_sale_prices, create_coupon, create_promotion)
    requires: human_approval
    approver_role: merchandiser
  display_schedule:
    when: reaches_customers              # schedule_banner, schedule_display, publish_curation
    requires: human_approval
    approver_role: merchandiser
  product_approve:
    when: "structural_change or new_product"
    requires: human_approval
    approver_role: catalog_admin
  bulk_catalog_change:
    when: always                         # import_products
    requires: human_approval
    approver_role: catalog_admin
  claim_approve:
    when: "liability == customer_fault and extra_charge"
    requires: human_approval
    approver_role: operator
  remedy_cash:
    when: "remedy_type == cash"
    requires: payout_approval
    approver_role: payout_approver
  member_block:
    when: always
    requires: human_approval
    approver_role: operator

no_approval:                             # 프리뷰 후 바로 실행
  - add_to_cart
  - update_my_preferences

person_only:                             # 툴이 아니며 UI 버튼만 호출 (plan.md §3.6)
  - "POST /change-sets/{id}/approve"
  - "POST /change-sets/{id}/undo"
  - "POST /orders"
  - "POST /returns"
  - "POST /memories/{id}/undo"
  - "POST /gift-orders/{id}/accept"
