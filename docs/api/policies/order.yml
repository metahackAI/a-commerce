# policy: order — 장바구니·체크아웃·주문·결제 규칙 (데이터)
# 값은 의미 있는 영단어, 금액은 {value, currency}. 데모 값은 plan.md §4.1과 같다.
version: 2

free_shipping_min_subtotal:              # 무료 배송 기준
  amount: { value: 80.00, currency: USD }
  measured: before_member_benefits       # 회원 혜택 적용 전 소계로 판단 (Jamie: $89.00 → 무료)

cart:
  separate_by: [order_type]              # 일반 주문과 구독 분리
  no_mix: [domestic_international]       # 국내·해외 배송 혼합 금지
  retention_days: 30
  max_lines: 50
  shows: [subtotal, member_benefit, shipping, total]   # 혜택은 한 줄 ("VIP weekend −$17.80")

checkout_validation:                     # 주문 준비·주문 시 반드시 통과
  - common_payment_method_exists
  - stock_available
  - product_sellable                     # 품절·판매 종료 아님
  - no_domestic_international_mix
  - server_price_ge_client_price         # 서버 계산가 ≥ 화면 가격 (할인 우회 차단)
  - price_floor_respected                # catalog.price_floor

payment:
  primary_methods_per_order: 1
  methods: [credit_card, bank_transfer, virtual_account, loyalty_points]
  loyalty_as_secondary: true             # 적립금은 보조 결제
  guest_allows_loyalty: false
  subscription_card_only: true
  virtual_account_hold_days: 3           # 입금 대기
  installment: card_only

inventory:
  reserve_on: place_order                # 주문하면 바로 재고 예약
  release_on: cancel_approved
  unpaid_ttl_minutes: 30                 # 미결제 자동 취소

order_status:                            # schema.org OrderStatus 멤버 (snake_case 단어)
  values: [payment_due, processing, in_transit, delivered, returned, cancelled, problem]
  line_item_status_independent: true     # 라인별 상태 독립(부분 출고)
  event_sourced: true                    # 상태를 덮어쓰지 않고 이벤트 추가
  auto_confirm_days: 14                  # 배송 완료 후 자동 구매 확정

multi_address:
  enabled_if_quantity_gte: 2
  max_destinations: 10

order_types: [member, guest, agent_assisted, subscription, gift]
agent_assisted:
  payment: loyalty_points_only           # 상담원 대행 주문은 적립금 결제만
  single_shipping_address: true
gift:
  recipient_per_order: 1
  auto_cancel_if_no_address_days: 3
  recipient_can_change: [acceptance, address, options]   # 가격은 못 바꿈
international:
  require: [customs_information]

person_only:                             # 사람만 하는 일 (툴이 아님)
  place_order: "POST /orders"            # prepare_order는 프리뷰만, 주문은 쇼퍼가 버튼으로
refund_authority: operator_approval      # 쇼퍼는 취소를 '요청'만, 환불은 운영 승인
