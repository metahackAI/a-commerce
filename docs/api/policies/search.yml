# policy: search  — 검색·색인 규칙 (데이터)
version: 1

query:
  modes: [keyword, hybrid, vector]
  default_mode: hybrid
  expansion: [llm, synonym_dictionary]   # LLM 확장 + 사전 폴백
  expansion_fallback_keeps_ranking: true
  member_tier_filter_at_query_time: true # 사후 필터 금지
  tenant_isolation: enforced_in_query_dsl

ranking:
  signals: [text_relevance, vector_similarity, best_seller, best_rated, newest, trending, personalization]
  recalc: daily_batch
  exclusion: explicit_null               # 제외 기간은 명시적 null(제거 아님)

boost_exclude:
  scope: [tenant, language]              # 사이트·언어별 격리
  exclude_means: zero_result             # 제외어는 부재(억제 아님)

index:
  naming: "{type}-{tenant}-{lang}-{version}"
  reindex: blue_green_alias_swap         # 무중단 별칭 스왑
  incremental: changed_docs_only
  distributed_lock: true                 # 동시 색인 방지
  lexicon_change_requires_reindex: true  # 동의어/신조어 변경 → 재색인
  concurrency_limit: semaphore
  timeout_degrade: graceful
