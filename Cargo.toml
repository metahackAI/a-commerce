[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/auth",
    "crates/changeset",
    "crates/contract",
    "crates/core",
    "crates/facade",
    "crates/http",
    "crates/llm",
    "crates/mcp",
    "crates/policy",
    "crates/registry",
    "crates/server",
    "crates/store",
    "crates/testkit",
    "crates/domains/*",
    "services/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# internal
acom-core = { path = "crates/core" }
acom-contract = { path = "crates/contract" }
acom-policy = { path = "crates/policy" }
acom-store = { path = "crates/store" }
acom-auth = { path = "crates/auth" }
acom-changeset = { path = "crates/changeset" }
acom-registry = { path = "crates/registry" }
acom-http = { path = "crates/http" }
acom-mcp = { path = "crates/mcp" }
acom-llm = { path = "crates/llm" }
acom-agent = { path = "crates/agent" }
acom-facade = { path = "crates/facade" }
acom-testkit = { path = "crates/testkit" }
acom-server = { path = "crates/server" }
acom-catalog = { path = "crates/domains/catalog" }
acom-search = { path = "crates/domains/search" }
acom-merchandising = { path = "crates/domains/merchandising" }
acom-promotion = { path = "crates/domains/promotion" }
acom-customer = { path = "crates/domains/customer" }
acom-sales = { path = "crates/domains/sales" }
acom-fulfillment = { path = "crates/domains/fulfillment" }
acom-messaging = { path = "crates/domains/messaging" }
acom-platform = { path = "crates/domains/platform" }
acom-analytics = { path = "crates/domains/analytics" }
acom-community = { path = "crates/domains/community" }
acom-partner = { path = "crates/domains/partner" }
acom-integration = { path = "crates/domains/integration" }

# external
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10", features = ["serde"] }
futures = "0.3"
rand = { version = "0.9.5", default-features = false }
rand_chacha = { version = "0.9.0", default-features = false }
rust_decimal = { version = "1.43", features = ["serde-with-arbitrary-precision"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_norway = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "json", "chrono", "rust_decimal"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 1
