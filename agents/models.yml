# Models the agent runtime can use (docs/backend/agent.md §8.1). Agent definitions name them by
# alias. Endpoints, model ids, and keys come from these environment variables
# (infra/README.md §5); a model with an empty variable is not configured.
#
# price (optional): {input_per_million_tokens: "0.10", output_per_million_tokens: "0.30", currency: USD}
# Leave it out until the provider's price list is known; the turn then reports no cost for it.
models:
  glimmer:
    display_name: Muse Glimmer 30B
    base_url_env: GLIMMER_BASE_URL
    model_env: GLIMMER_MODEL
    structured_output: json_schema
    timeout_seconds: 30
    # Whether replies stream is found out in the background (docs/backend/agent.md §7): each way
    # of crates/llm StreamVariant is tried with a short request at start and every 10 minutes
    # until one answers in pieces; turns stream only then, and otherwise get the reply whole.
    # `stream_reply: [...]` would narrow the ways tried. (Nov 2: the demo endpoint streamed no
    # answer under any way while the same request unstreamed answered, so it shows as off.)
  spark:
    display_name: Muse Spark
    base_url_env: META_API_BASE_URL
    model_env: SPARK_MODEL
    api_key_env: META_API_KEY
    structured_output: json_schema
    timeout_seconds: 45
