# policy: community — 게시판·글·댓글 규칙 (데이터)
# community 도메인 툴이 이 파일로 규칙을 강제한다. 값은 의미 있는 영단어(목록은 docs/api/enums.md).
# 프리뷰의 checks[].rule은 이 파일의 키 경로를 그대로 쓴다(예: moderation.profanity_filter, spam).
# 이 값들은 새 스토어의 기본값이다.
version: 1

board:                                   # configure_board. check: board.name_unique
  types: [free, review, question, event] # acom:board_type
  write_permission:                      # check: board.write_permission. 누가 글을 쓸 수 있는가
    values: [everyone, member, staff]
    default: member                      # 기본값. 게시판을 만들 때 지정하지 않으면
  allow_secret: true                     # 기본값. 비밀글(작성자·운영자만 열람) 허용
  name_unique: true                      # 고정. 같은 스토어 안에서 게시판 이름은 하나(duplicate_board_name)

moderation:                              # 금칙어·신고·블라인드
  default_mode: post_review              # 기본값. pre_review(검수 뒤 공개) | post_review(공개 뒤 검수) | none
  profanity_filter:                      # check: moderation.profanity_filter (에러 profanity_blocked)
    enabled: true                        # 기본값
    word_list: store_defined             # 고정. 금칙어 목록은 스토어가 덮어쓰기로 관리한다
    on_match: block                      # 기본값. block(쓰기 거부) | hold_for_review(held_for_review로 저장)
  report_reasons: [spam, abuse, obscene, advertisement, fake, irrelevant, other]   # enums.md §2.4 acom:report_reason
  report_threshold: 5                    # 기본값. check: moderation.report_threshold. 서로 다른 신고자 수가 이만큼이면 자동 블라인드 후보
  blind:                                 # 블라인드·삭제
    on_threshold: hold_for_review        # 기본값. hold_for_review(모더레이션 대기열) | auto_blind(즉시 blinded)
    operator_reason_required: true       # 고정. 운영자가 블라인드·삭제할 때 사유 필수
    keep_replies_on_delete: true         # 기본값. 글을 지워도 다른 사람의 댓글이 있으면 내용만 가리고 남긴다(has_protected_replies)
  author_masking:                        # 공개 목록의 작성자 이름 (ho****)
    visible_chars: 2                     # 기본값
    mask_char: "*"                       # 기본값

spam:                                    # check: spam. 글·댓글 공통
  duplicate_window_minutes: 5            # 기본값. 같은 작성자·같은 본문이 이 안에 다시 오면 첫 결과를 돌려준다(멱등)
  max_links: 2                           # 기본값. 본문 링크 수 상한
  max_posts_per_hour: 10                 # 기본값. 작성자당 글·댓글 수 상한
  on_match: block                        # 기본값. block | hold_for_review

attachment:                              # check: attachment. 게시판이 첨부를 허용할 때만
  allowed_by_default: true               # 기본값. configure_board의 allow_attachment 기본값
  media_types: [image/jpeg, image/png, image/webp]   # 기본값
  max_files: 5                           # 기본값
  max_file_mb: 10                        # 기본값

reply:                                   # 댓글
  max_depth: 2                           # 기본값. 대댓글 깊이(글 → 댓글 → 대댓글)
