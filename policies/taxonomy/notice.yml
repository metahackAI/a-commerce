# policy: taxonomy/notice — 상품정보제공고시 템플릿 (초안)
# 아직 어떤 코드도 이 파일을 읽지 않는다. 설계: docs/catalog-taxonomy.md §6
# 근거: 「전자상거래 등에서의 상품 등의 정보제공에 관한 고시」(공정거래위원회고시 제2022-15호, 2023-01-01 시행)의 별표.
# 상품 페이지의 "상품정보 제공고시" 표는 노드의 notice 번호로 이 템플릿을 골라 만든다.
# from: 속성 id(taxonomy), 상품 칸(product.*), 스토어 설정(store.*), 고정 문구(text).
# 스토어가 한국 고시를 켜면(store.legal_notice: kr) 각 항목의 required가 공개 조건이 된다.
version: 0

store_settings:                          # 상품이 아니라 스토어에서 오는 값
  warranty_terms: {label: {en: Warranty terms, ko: 품질보증기준}}
  after_sales_contact: {label: {en: After-sales contact and phone, ko: A/S 책임자와 전화번호}}
  consumer_phone: {label: {en: Customer service phone, ko: 소비자 상담 전화번호}}

food_type_names:                         # 식품의 유형: 코드 → 한국 법정 이름(식품공전). 확인 필요
  confectionery: 과자
  nut_products: 견과류가공품
  other_processed_food: 기타가공품
  fried_noodles: 유탕면

groups:
  "1":
    label: {en: Clothing, ko: 의류}
    items:
      - {label: 제품 소재, from: fiber_composition, note: 섬유 조성(혼용률 %). 기능성 원단은 시험성적서나 허가 사항}
      - {label: 색상, from: color_name}
      - {label: 치수, from: product.size}
      - {label: 제조자(수입품은 수입자 포함), from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 세탁방법 및 취급시 주의사항, from: [care_method, care]}
      - {label: 제조연월, from: manufactured_month}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "2":
    label: {en: Shoes, ko: 구두/신발}
    items:
      - {label: 제품 주소재(운동화는 겉감·안감 구분), from: materials}
      - {label: 색상, from: color_name}
      - {label: 치수(발길이 mm), from: foot_length, note: 굽 높이는 굽 재료를 쓴 여성화만}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 취급시 주의사항, from: care}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "3":
    label: {en: Bags, ko: 가방}
    items:
      - {label: 종류, from: product_type}
      - {label: 소재, from: materials}
      - {label: 색상, from: color_name}
      - {label: 크기, from: dimensions}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 취급시 주의사항, from: care}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "4":
    label: {en: Fashion accessories, ko: 패션잡화(모자/벨트/액세서리)}
    items:
      - {label: 종류, from: product_type}
      - {label: 소재, from: [material_family, materials]}
      - {label: 치수, from: [product.size, dimensions]}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 취급시 주의사항, from: care}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "10":
    label: {en: Office machines and computers, ko: 사무용기기(컴퓨터/노트북/프린터)}
    items:
      - {label: 품명 및 모델명, from: [product.name, model_name]}
      - {label: KC 인증정보, from: [certifications.kc_safety, certifications.kc_radio]}
      - {label: 정격전압·소비전력, from: [rated_voltage, power_consumption]}
      - {label: 에너지소비효율등급, from: certifications.kr_energy_grade, when: 표시 의무 대상일 때}
      - {label: 동일모델의 출시년월, from: release_month}
      - {label: 제조자(수입품은 수입자 포함), from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 크기·무게(무게는 노트북 등 휴대형만), from: [dimensions, weight]}
      - {label: 주요 사양(성능, 용량, 운영체제 포함 여부), from: [screen_size, memory, storage, os]}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "12":
    label: {en: Small electronics, ko: 소형전자}
    items:
      - {label: 품명 및 모델명, from: [product.name, model_name]}
      - {label: KC 인증정보, from: [certifications.kc_safety, certifications.kc_radio]}
      - {label: 정격전압·소비전력, from: [rated_voltage, power_consumption]}
      - {label: 출시년월, from: release_month}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 크기·무게, from: [dimensions, weight]}
      - {label: 주요 사양, from: compare_attributes}   # 노드의 비교 속성으로 만든다
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "13":
    label: {en: Mobile devices, ko: 휴대형 통신기기(휴대폰/태블릿)}
    items:
      - {label: 품명 및 모델명, from: [product.name, model_name]}
      - {label: KC 인증정보, from: [certifications.kc_safety, certifications.kc_radio]}
      - {label: 출시년월, from: release_month}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: 제조국, from: country_of_origin}
      - {label: 크기·무게, from: [dimensions, weight]}
      - {label: 이동통신 가입조건(통신사, 가입절차, 추가 부담 비용), from: text, text: "해당 없음(자급제)"}
      - {label: 주요 사양, from: compare_attributes}
      - {label: 품질보증기준, from: store.warranty_terms}
      - {label: A/S 책임자와 전화번호, from: store.after_sales_contact}
  "21":
    label: {en: Processed food, ko: 가공식품}
    items:
      - {label: 제품명, from: product.name}
      - {label: 식품의 유형, from: food_type, names: food_type_names}
      - {label: 생산자 및 소재지(수입품은 생산자, 수입자, 제조국), from: [manufacturer, importer, country_of_origin]}
      - {label: 제조연월일, 소비기한 또는 품질유지기한, from: lot, note: 재고 로트가 생기기 전에는 "제품 별도 표기"로 둔다}
      - {label: 포장단위별 내용물의 용량(중량), 수량, from: net_quantity}
      - {label: 원재료명 및 함량(원산지 포함), from: ingredients}
      - {label: 영양성분, from: nutrition, when: 영양표시 대상 식품일 때}
      - {label: 유전자변형식품 표시, from: gmo}
      - {label: 소비자 안전을 위한 주의사항(알레르기 포함), from: allergens}
      - {label: 수입식품 문구, from: text, text: "수입식품안전관리 특별법에 따른 수입신고를 필함", when: 수입품일 때}
      - {label: 소비자 상담 전화번호, from: store.consumer_phone}
  "40":
    label: {en: Other goods, ko: 기타 재화}
    verified: false                      # 항목은 기억에 기댄 것. 원문 별표를 읽고 고친다
    items:
      - {label: 품명 및 모델명, from: [product.name, model_name]}
      - {label: 법에 의한 인증·허가 등을 받았음을 확인할 수 있는 경우 그에 대한 사항, from: certifications}
      - {label: 제조국 또는 원산지, from: country_of_origin}
      - {label: 제조자/수입자, from: [manufacturer, importer]}
      - {label: A/S 책임자와 전화번호 또는 소비자상담 관련 전화번호, from: store.after_sales_contact}
