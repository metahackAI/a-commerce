# policy: taxonomy/common — 모든 상품군이 쓰는 단위와 속성 (초안)
# 플랫폼 코드는 아직 읽지 않는다. 패션몰 시드 생성기(crates/testkit/src/mall)만 읽는다. 설계: docs/catalog-taxonomy.md
# 모양: 속성은 한 번만 정의하고, 노드(nodes.yml)가 골라 쓴다. 값 목록은 짧게(20개 안팎), 긴 꼬리 낱말은 words에.
# 언어: 정의는 영어 하나(코드, 이름표, means, words). 다른 언어의 이름표는 그 언어 스토어가 생길 때 언어별 번역 파일에 따로 둔다. 쇼퍼의 다른 언어 질문은 질의 쪽(에이전트, 질의 이해)이 영어 코드로 바꾼다.
version: 0

kinds:                                   # 값의 종류. 검색·화면·검사 코드는 이 종류만 안다(상품군을 모른다)
  one: one value from the list
  many: several values from the list
  scale: one value from an ordered list; the written order is the order (first is lowest); searched with at_least / at_most
  number: a number with a unit, stored in one canonical unit; searched by range; facets use bands
  identifier: matched exactly, ignoring hyphens, spaces and case
  compatibility: ids of other products or device models; searched by contains
  evidence: certification records {scheme, code, rating, issued_by, valid_until} that open other values
  tri_state: per item contains | may_contain | free_from; no value means unknown, not none
  date: a date; precision says year-month and so on
  text: free text, not searched; for display and legal notices
  computed: calculated by the platform from other values; never entered

units:                                   # 표준 단위. code는 UN/CEFACT(schema.org unitCode가 쓰는 코드)
  gram:        {code: GRM, label: g}
  kilogram:    {code: KGM, label: kg, to: {gram: 1000}}
  milligram:   {code: MGM, label: mg, to: {gram: 0.001}}
  millilitre:  {code: MLT, label: mL}
  litre:       {code: LTR, label: L, to: {millilitre: 1000}}
  millimetre:  {code: MMT, label: mm}
  centimetre:  {code: CMT, label: cm, to: {millimetre: 10}}
  inch:        {code: INH, label: in, to: {millimetre: 25.4}}
  gigabyte:    {code: E34, label: GB}
  terabyte:    {code: E35, label: TB, to: {gigabyte: 1024}}   # 확인 필요: E35
  watt:        {code: WTT, label: W}
  volt:        {code: VLT, label: V}
  hertz:       {code: HTZ, label: Hz}
  milliampere_hour: {code: E09, label: mAh}                 # 확인 필요: E09
  watt_hour:   {code: WHR, label: Wh}
  kilocalorie: {code: E14, label: kcal}                    # 확인 필요: E14
  square_metre: {code: MTK, label: m²}
  piece:       {code: H87, label: pcs}
  percent:     {code: P1, label: "%"}
  day:         {code: DAY, label: days}
  month:       {code: MON, label: months}

attributes:
  product_type:
    kind: one
    level: group                         # group = 상품(product_group), variant = 변형(product)
    label: Product type
    filter: true
    values_from: node                    # 값 목록은 노드마다 nodes.yml의 product_types에
    export: {schema_org: additionalProperty}

  model_name:
    kind: identifier
    level: group
    label: Model name
    filter: false
    export: {schema_org: model}

  model_number:
    kind: identifier
    level: variant                       # 색·용량마다 다를 수 있음
    label: Model number
    filter: false
    search: exact_token                  # 검색 색인에서 낱말로 쪼개지 않고 하나의 토큰으로
    export: {schema_org: mpn, feed: mpn}

  color_name:
    kind: text
    level: variant
    label: Color
    source: product.color                # 변형의 color 칸 그대로
    export: {schema_org: color, feed: color}

  color_family:
    kind: many
    level: variant
    label: Color family
    filter: true
    max_values: 3                        # 주색 먼저
    values:
      black:    {label: Black}
      grey:     {label: Grey, words: [gray, charcoal, heather]}
      white:    {label: White, words: [off-white, ivory, cream]}
      beige:    {label: Beige, words: [sand, oatmeal, stone]}
      brown:    {label: Brown, words: [tan, camel]}
      navy:     {label: Navy, words: [dark blue]}
      blue:     {label: Blue, words: [indigo, sky]}
      green:    {label: Green}
      khaki:    {label: Khaki, words: [olive, military]}
      red:      {label: Red}
      pink:     {label: Pink}
      purple:   {label: Purple}
      yellow:   {label: Yellow}
      orange:   {label: Orange, words: [rust]}
      metallic: {label: Metallic, words: [silver, gold]}
      multi:    {label: Multicolor, means: "Three or more colors with no main one."}
    from_color: colors.yml                 # color name → families and swatch
    export: {schema_org: additionalProperty}

  material_family:
    kind: one
    level: group
    label: Material
    filter: true
    compare: true
    values:
      cotton: {label: Cotton}
      linen: {label: Linen}
      wool: {label: Wool, words: [merino, lambswool, alpaca, mohair, tweed]}
      cashmere: {label: Cashmere}
      silk: {label: Silk}
      hemp: {label: Hemp}
      polyester: {label: Polyester}
      acrylic: {label: Acrylic}
      nylon: {label: Nylon}
      modal_rayon: {label: Modal and rayon, words: [viscose, lyocell]}
      leather: {label: Leather}
      suede: {label: Suede}
      synthetic_leather: {label: Synthetic leather, words: [faux leather, vegan leather, pu leather]}
      rubber: {label: Rubber}
      cork: {label: Cork}
      straw: {label: Straw, words: [raffia, toquilla, panama]}
      plastic: {label: Plastic, words: [polycarbonate, tpu]}
      metal: {label: Metal, words: [aluminium, aluminum, steel]}
      silicone: {label: Silicone}
      glass: {label: Glass}
      mixed: {label: Mixed, means: "No single material makes up most of the item."}
    export: {schema_org: material, feed: material}

  weight:
    kind: number
    level: variant
    label: Weight
    unit: gram
    accepts: [gram, kilogram]
    compare: true
    export: {schema_org: weight}

  dimensions:
    kind: number
    level: variant
    label: Size (W × D × H)
    unit: millimetre
    accepts: [millimetre, centimetre, inch]
    parts: [width, depth, height]
    export: {schema_org: [width, depth, height]}

  country_of_origin:
    kind: one
    level: group
    label: Country of origin
    filter: true
    values_from: iso_3166_alpha2         # 목록 하나(ISO 3166 두 글자). 이름표는 언어별 국가 이름
    export: {schema_org: countryOfOrigin}

  manufacturer:
    kind: text
    level: group
    label: Manufacturer
    default_from: brand                  # 브랜드 값을 기본으로, 상품에서 덮어씀
    export: {schema_org: manufacturer}

  importer:
    kind: text
    level: group
    label: Importer

  manufactured_month:
    kind: date
    precision: month
    level: variant
    label: Manufactured
    note: May be replaced by the forms the Korean notice allows (date received, a period). For food it moves to the stock lot once lots exist.

  certifications:
    kind: evidence
    level: variant
    label: Certifications
    schemes:                             # 근거 제도. rating이 있으면 그 등급이 필터가 될 수 있음
      kc_safety:        {label: KC safety, tiers: [safety_certification, safety_confirmation, supplier_conformity]}
      kc_radio:         {label: KC radio conformity}
      kr_energy_grade:  {label: Korean energy efficiency grade, ratings: ["1", "2", "3", "4", "5"]}
      ip_rating:        {label: IP rating, ratings: [ip54, ip55, ip65, ip67, ip68]}
      organic:          {label: Organic}
      haccp:            {label: HACCP}
      halal:            {label: Halal}
      vegan:            {label: Vegan}
      gluten_free:      {label: Gluten-free}
    demo_marks_synthetic: true           # 시연 데이터의 번호는 가짜임을 데이터에 표시(provenance)
    export: {schema_org: hasCertification}

  warranty_months:
    kind: number
    level: group
    label: Warranty
    unit: month
    default_from: store                  # 스토어 설정 기본값, 상품에서 덮어씀

  target_gender:
    kind: one
    level: group
    label: Gender
    filter: true
    values:                              # Google·OpenAI 피드 목록 그대로
      female: {label: Women}
      male: {label: Men}
      unisex: {label: Unisex}
    export: {schema_org: audience.suggestedGender, feed: gender}

  age_group:
    kind: one
    level: group
    label: Age group
    values:                              # Google·OpenAI 피드 목록 그대로
      newborn: {label: Newborn, means: "0 to 3 months."}
      infant: {label: Infant, means: "3 to 12 months."}
      toddler: {label: Toddler, means: "1 to 5 years."}
      kids: {label: Kids, means: "5 to 13 years."}
      adult: {label: Adult}
    export: {schema_org: audience.suggestedMinAge, feed: age_group}

search:
  unknown_is_not_none: true              # 값이 비어 있는 상품은 "없음" 필터에 걸리지 않는다
  explain_dropped: true                  # 3상태·근거 때문에 뺀 상품 수를 응답에 적는다
  relax_order: [softness, sheerness, thickness, fabric_type, pattern, color_family, use]   # 결과 0개일 때 앞에서부터 하나씩 푼다. 숫자 범위는 bands 한 칸씩 넓힌다
