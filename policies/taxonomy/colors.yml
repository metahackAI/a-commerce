# policy: taxonomy/colors — named colors (draft)
# No code reads this file yet. Design: docs/catalog-taxonomy.md §4.
# Every color name a store sells maps to one to three color families (common.yml color_family,
# main one first) and one swatch. The swatch is the chip on the page and the shade the photo
# prompt asks for. Shoppers filter and search by family ("grey" finds Charcoal, Slate and Ash);
# the name stays what the brand calls it.
# A store may add its own names. Each one needs a family and a swatch before a product can use it.
# `for` limits a name to some categories (denim washes). `pattern` sets the product's pattern value.
version: 0

colors:
  # black
  Black:          {family: [black], hex: "#141414"}
  Onyx:           {family: [black], hex: "#22201F"}
  Ink:            {family: [black], hex: "#1B1F2A"}
