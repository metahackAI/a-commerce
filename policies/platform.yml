# policy: platform — 할 일 감시 작업, 역할·관리자·API 키 규칙 (데이터)
# docs/api/platform.md가 인용하는 키만 둔다. 값은 새 스토어의 기본값이다.
# 금액은 {value, currency}, 비율은 0–1. 다른 파일의 값은 *_from으로 가리키고 여기 다시 적지 않는다.
version: 1

# 감시 작업: commerce의 예약 작업(platform.job)이 주기마다 기준을 읽어 데이터를 확인하고,
# 기준을 넘으면 할 일(task)을 만들거나 같은 원인의 열린 할 일을 갱신한다. docs/api/platform.md §task
watchers:
  returns_over_refund_threshold:         # 사람 승인이 필요한 금액의 반품 요청이 기다림
    enabled: true
    every_minutes: 30
    amount_over_from: approval.thresholds.refund   # 이 임계(기본 $200.00)를 넘는 요청만 센다
    claim_status: requested              # enums.md §1.5
    min_count: 1                         # 이 건수 이상이면 할 일
    min_waiting_hours: 0                 # 접수 뒤 이만큼 지난 것만
    origin: agent_noticed                # 운영 에이전트가 분류하고 변경셋(환불·메시지)을 만든다
  stock_out_forecast:                    # 최근 판매 속도로 곧 품절될 변형
    enabled: true
    every_minutes: 60
    lookback_days: 7                     # 판매 속도를 계산하는 기간
    days_until_stockout_lte: 5           # 남은 재고 ÷ 하루 판매량이 이 일수 이하면
    exclude_availability: [discontinued, pre_order]
    origin: agent_noticed                # 운영 에이전트가 재주문 초안을 만든다
  price_below_cost:                      # 정가가 원가보다 낮은 상품
    enabled: true
    every_minutes: 60
    compare: list_price_below_cost       # list_price < cost (catalog.yml pricing.levels)
    fix: raise_to_price_floor            # catalog.yml price_floor까지 올리는 변경셋을 만든다
    run_fix: ask                         # ask(사람 승인 대기) | standing_approval(미리 승인된 자동화로 바로 실행, 되돌리기 기한 적용)
    origin: automation

roles:
  known_scopes: [tools, changeset, human, external, admin]   # check: roles.known_scopes. 스코프 앞부분(gateway.md §2). 이 밖의 스코프는 거부
  known_roles: [operator, merchandiser, catalog_admin, payout_approver, platform_admin]   # check: roles.known_roles. approval.yml approver_role 값 포함
  least_privilege: warn_on_human_scopes  # check: roles.least_privilege. human:* 스코프를 주는 배정은 approval_reason에 표시

admin_users:
  email_unique: true                     # check: admin_users.email_unique

orgs:
  no_cycle: true                         # check: orgs.no_cycle. 자기 자신·하위 조직을 상위로 둘 수 없음

api_keys:
  scope_within_issuer: true              # check: api_keys.scope_within_issuer. 발급자 역할의 스코프를 넘지 않음
  external_agent_scopes: [external:read, external:cart, external:prepare_order]   # check: api_keys.external_agent_scopes. 외부 에이전트 키가 가질 수 있는 스코프
